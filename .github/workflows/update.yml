name: Update NPB Schedule Data

on:
  schedule:
    # 09:00 UTC daily = 18:00 JST (weekend day games finish ~16:30-17:30 JST)
    - cron: '0 9 * * *'
    # 13:45 UTC daily = 22:45 JST (weekday night games finish ~21:15-21:45 JST)
    - cron: '45 13 * * *'
    # 15:30 UTC daily = 00:30 JST (late-night safety sweep for 12-inning games / rain delays)
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Season to scrape (default: 2026, or "all" for 2005-2026)'
        required: false
        default: '2026'

permissions:
  contents: write

jobs:
  scrape-npb:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run NPB Scraper
        run: |
          if [ "${{ github.event.inputs.seasons }}" = "all" ]; then
            echo "Running one-off historical scrape for all seasons (2005-2026)..."
            node scripts/scrapeNPB.js --all
          elif [ -n "${{ github.event.inputs.seasons }}" ]; then
            echo "Running scrape for season ${{ github.event.inputs.seasons }}..."
            node scripts/scrapeNPB.js --season "${{ github.event.inputs.seasons }}"
          else
            echo "Running regular scheduled scrape for current season (2026)..."
            node scripts/scrapeNPB.js --season 2026
          fi

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/; then
            git add data/
            SEASON_LABEL="${{ github.event.inputs.seasons || '2026' }}"
            git commit -m "Update NPB ${SEASON_LABEL} regular season data [skip ci]"
            git push
            echo "Successfully committed and pushed updated NPB data."
          else
            echo "No data changes detected. Everything is up to date."
          fi
